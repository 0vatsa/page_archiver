<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Archiver</title>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/components.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

<header class="topbar">
  <img class="brand-mark" src="icons/icon-32.png" alt="" width="20" height="20" />
  <h1 class="brand">Page Archiver</h1>
  <span class="pill" id="health" role="status"><span class="dot"></span><span id="health-label">Archiving</span></span>
  <button class="icon-btn" id="btn-settings" type="button" aria-label="Open settings" title="Settings">
    <span data-icon="settings"></span>
  </button>
</header>

<main>
  <section class="this-page" aria-labelledby="this-page-label">
    <h2 class="overline" id="this-page-label">This page</h2>
    <div class="card page-card">
      <div class="page-head">
        <span id="page-favicon"><span class="favicon" aria-hidden="true"></span></span>
        <div class="page-id">
          <div class="page-title" id="page-title"><span class="skeleton" style="width: 70%; height: 14px"></span></div>
          <div class="page-url" id="page-url"></div>
        </div>
      </div>

      <div class="page-status" id="page-status" aria-live="polite">
        <span class="skeleton" style="width: 55%; height: 12px"></span>
      </div>

      <div class="page-actions">
        <button class="btn btn-primary btn-lg" id="btn-capture" type="button" disabled>
          <span data-icon="archive"></span><span class="label">Archive now</span>
        </button>
        <div class="menu-anchor">
          <button class="icon-btn btn-more" id="btn-more" type="button"
                  aria-label="More actions" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
            <span data-icon="more"></span>
          </button>
          <div class="menu" id="more-menu" role="menu" aria-label="More actions" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <p class="summary num" id="summary" title="A page is a unique address. A snapshot is one saved copy of it.">
    <span class="skeleton" style="width: 60%; height: 12px"></span>
  </p>

  <section class="recent" aria-labelledby="recent-label">
    <div class="recent-head">
      <h2 class="overline" id="recent-label">Recent</h2>
      <label class="recent-search" id="recent-search" hidden>
        <span data-icon="search"></span>
        <span class="sr-only">Filter recent pages</span>
        <input type="search" id="recent-filter" placeholder="Filter" autocomplete="off" />
      </label>
    </div>
    <ul class="recent-list" id="recent-list" aria-labelledby="recent-label">
      <li class="row-skeleton"><span class="skeleton"></span><span class="skeleton"></span></li>
      <li class="row-skeleton"><span class="skeleton"></span><span class="skeleton"></span></li>
      <li class="row-skeleton"><span class="skeleton"></span><span class="skeleton"></span></li>
    </ul>
    <div id="recent-state"></div>
  </section>
</main>

<footer class="bottombar">
  <span class="footer-dest" id="footer-dest"></span>
  <button class="btn-link" id="btn-all-settings" type="button">All settings <span data-icon="chevronRight"></span></button>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
